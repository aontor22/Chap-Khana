name: React production checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Static type check and production build
        run: npm run build
      - name: Photo menu and SQL consistency tests
        run: npm run test:catalog
      - name: Unit tests
        run: npm test
